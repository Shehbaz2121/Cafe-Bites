<ul class="flex gap-4 p-4 justify-center">
  @for(food of foods; track food) {
    <!-- The 'group' class captures the hover event for everything inside -->
    <a href="#" class="group block shrink-0">
      
      <!-- HOVER EFFECTS ON THE CIRCLE: Scales up, darkens border, and deepens shadow -->
      <li class="h-24 w-24 overflow-hidden rounded-full border-2 border-orange-500 shadow-sm transition-all duration-300 
                 group-hover:scale-105 group-hover:border-orange-600 group-hover:shadow-md 
                 sm:h-32 sm:w-32">
        
        <!-- HOVER EFFECT ON THE IMAGE: Zooms in and tilts the food slightly -->
        <img [src]="food" 
             alt="Food item" 
             class="h-full w-full object-cover transition-transform duration-300 
                    group-hover:scale-110 group-hover:rotate-3">
                    
      </li>
    </a>
  }
</ul>
