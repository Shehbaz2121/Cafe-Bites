<ul class="flex flex-wrap gap-6 p-4 justify-center">
  @for(food of foods; track food) {
    <a href="#" class="group block shrink-0">
      <li class="w-24 transition-all duration-300 transform group-hover:-translate-y-1 sm:w-32">
        <!-- Image Container -->
        <div class="h-24 w-24 mx-auto overflow-hidden rounded-full border-2 border-orange-500 shadow-sm transition-all duration-300 group-hover:border-orange-600 group-hover:shadow-lg sm:h-32 sm:w-32">
          <img [src]="food.imageURL" alt="Food item" class="h-full w-full object-cover transition-transform duration-300 group-hover:scale-110 group-hover:rotate-3">
        </div>

        <!-- Details Wrapper -->
        <div class="mt-3 flex flex-col items-center text-center relative px-1">
          <!-- Name & Favorite Heart Row -->
          <div class="flex items-center justify-center gap-1 w-full">
            <p class="text-xs sm:text-sm font-bold text-gray-800 line-clamp-1 group-hover:text-orange-600 transition-colors duration-200">
              {{food.name}}
            </p>
            <span class="text-xs text-red-500 hover:scale-125 transition-transform duration-200 cursor-pointer shrink-0">
              ❤
            </span>
          </div>

          <!-- Product Item Footer -->
          <div class="mt-1 flex flex-col items-center gap-0.5 w-full text-[10px] sm:text-xs text-gray-500 font-medium">
            <!-- Origins Tags -->
            <div class="flex flex-wrap justify-center gap-1 max-w-full">
              @for(origin of food.origins; track origin) {
                <span class="bg-gray-100 text-gray-600 px-1.5 py-0.5 rounded text-[9px] sm:text-[10px] uppercase tracking-wider font-semibold">
                  {{origin}}
                </span>
              }
            </div>

            <!-- Delivery Time Info -->
            <div class="flex items-center justify-center gap-1 mt-1 text-gray-400">
              <svg xmlns="http://w3.org" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-3 h-3 stroke-orange-500">
                <circle cx="12" cy="12" r="10" />
                <polyline points="12 6 12 12 16 14" />
              </svg>
              <span>{{food.deliveryTime}}</span>
            </div>

            <!-- Price Highlight -->
            <div class="mt-1 text-sm sm:text-base font-extrabold text-orange-600">
              {{ food.price | currency }}
            </div>
          </div>
        </div>
      </li>
    </a>
  }
</ul>
