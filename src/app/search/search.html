<div class="flex items-center mt-2 gap-2 p-2 max-w-md mx-auto bg-amber-50/60 backdrop-blur-sm border border-stone-200 rounded-full shadow-md transition-all duration-300 focus-within:shadow-lg focus-within:border-amber-700/40">
  <!-- Search Input -->
  <input 
    type="text" 
    (input)="searchTerm.set($any($event.target).value)" 
    placeholder="Search food..." 
    class="w-full pl-4 pr-2 py-2 bg-transparent text-stone-800 placeholder-stone-400 font-medium rounded-full focus:outline-none text-base"
  >
  
  <!-- Search Button -->
  <button 
    (click)="search()" 
    class="px-6 py-2 bg-stone-800 hover:bg-amber-900 text-amber-50 font-semibold rounded-full shadow-sm hover:shadow transition-all duration-200 active:scale-95 whitespace-nowrap text-sm tracking-wide"
  >
    Search
  </button>
</div>
