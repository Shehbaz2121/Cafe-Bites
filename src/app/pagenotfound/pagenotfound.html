<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://unpkg.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 flex items-center justify-center min-h-screen px-4">

  <div class="max-w-md w-full text-center">
    <!-- 404 Header -->
    <p class="text-base font-semibold text-indigo-600 uppercase tracking-wide">404 Error</p>
    <h1 class="mt-2 text-4xl font-extrabold tracking-tight sm:text-5xl">Page not found</h1>
    <p class="mt-4 text-base text-gray-600">
      Sorry, we couldn’t find the page you’re looking for. It might have been moved, deleted, or you may have mistyped the URL.
    </p>

    <!-- Action Buttons -->
    <div class="mt-6 flex flex-col sm:flex-row items-center justify-center gap-3">
      <a routerLink="/" class="w-full sm:w-auto inline-flex justify-center items-center px-5 py-3 border border-transparent text-base font-medium rounded-lg text-white bg-indigo-600 hover:bg-indigo-700 transition duration-150 ease-in-out shadow-sm">
        Back to home
      </a>
    </div>
  </div>

</body>
</html>
