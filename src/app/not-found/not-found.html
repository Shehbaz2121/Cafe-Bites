@if(visible){
  <div class="min-h-[60vh] flex items-center justify-center px-4 py-12">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl shadow-stone-300/50 border border-stone-200/80 p-8 sm:p-10 text-center space-y-5">
      
      <!-- Warm Café Icon Badge -->
      <div class="w-16 h-16 mx-auto rounded-full bg-amber-100/80 border border-amber-200/60 flex items-center justify-center text-3xl">
        ☕
      </div>

      <!-- Not Found Message -->
      <div class="text-xl font-serif font-bold text-stone-900 leading-snug">
        {{notFoundMessage}}
      </div>

      <!-- Reset Link Button -->
      <div class="pt-2">
        <a 
          routerLink="{{resetLinkRoute}}"
          class="inline-flex items-center justify-center px-7 py-3 bg-amber-900 hover:bg-amber-950 active:scale-[0.98] text-amber-50 text-sm font-semibold rounded-full shadow-md shadow-amber-900/20 transition-all duration-200"
        >
          {{resetLinkText}}
        </a>
      </div>

    </div>
  </div>
}
